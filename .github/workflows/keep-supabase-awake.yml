name: Keep Supabase Awake

on:
  schedule:
    - cron: "17 2 1,6,11,16,21,26 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database health endpoint
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-all-errors --max-time 30 https://qzh20.vercel.app/api/health)
          echo "HTTP $code"
          [ "$code" = "200" ] || [ "$code" = "503" ]
